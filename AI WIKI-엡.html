<title>AI WIKI</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* Layout: 연구 서가 — 왼쪽 서가 목록(내비게이션) + 오른쪽 열람대(작업 영역). 등급은 청록 농도 5단계. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --sunk:#E8EDEC; --ink:#162427; --muted:#5A6A6D; --line:#D6DEDD;
  --accent:#0D6B66; --accent-ink:#FFFFFF; --accent-soft:#DDEFED; --mark:#F2D16B; --danger:#B0412F; --ok:#2E7A4E; --warn:#A36A00;
  --g1:#CAD7D6; --g2:#9DC0BC; --g3:#68A39D; --g4:#33857F; --g5:#0D6B66;
  --f-display:"Gowun Batang", "Noto Serif KR", "AppleMyungjo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px; --shadow:0 1px 2px rgba(16,40,40,.06), 0 4px 16px rgba(16,40,40,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1516; --surface:#152022; --sunk:#1B282A; --ink:#E2EBEA; --muted:#92A4A5; --line:#283739;
  --accent:#4DBDB3; --accent-ink:#06201E; --accent-soft:#16393A; --mark:#B8962E; --danger:#E07A66; --ok:#62BE87; --warn:#D9A43A;
  --g1:#2A3B3D; --g2:#2F5856; --g3:#33786F; --g4:#3E9C93; --g5:#4DBDB3; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1516; --surface:#152022; --sunk:#1B282A; --ink:#E2EBEA; --muted:#92A4A5; --line:#283739;
  --accent:#4DBDB3; --accent-ink:#06201E; --accent-soft:#16393A; --mark:#B8962E; --danger:#E07A66; --ok:#62BE87; --warn:#D9A43A;
  --g1:#2A3B3D; --g2:#2F5856; --g3:#33786F; --g4:#3E9C93; --g5:#4DBDB3; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{padding:0 8px}
.brand b{font-family:var(--f-display);font-size:1.5rem;letter-spacing:.02em;display:block}
.brand span{color:var(--muted);font-size:.8rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.store{margin-top:auto;font-size:.78rem;color:var(--muted);padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.dot.on{background:var(--ok)} .dot.local{background:var(--warn)}
main{padding-block:28px 120px;padding-inline:clamp(16px,3.5vw,44px);min-width:0;max-width:1240px;width:100%}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-head>div{min-width:0}

.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel>h2,.panel>h3{margin-bottom:12px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 13px;font-weight:500;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input[type=text],input[type=url],input[type=number],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;line-height:1.65}

.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--sunk);font-size:.78rem;color:var(--ink)}
.chip.k{background:var(--accent-soft)}
.chip.ex{background:var(--mark);color:#3a2c00}
.gb{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:6px;font-family:var(--f-mono);font-weight:500;font-size:.85rem;color:#fff}
.gb.g0{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.gb.g1{background:var(--g1);color:var(--ink)} .gb.g2{background:var(--g2);color:var(--ink)} .gb.g3{background:var(--g3)} .gb.g4{background:var(--g4)} .gb.g5{background:var(--g5)}
:root[data-theme="dark"] .gb.g3,:root[data-theme="dark"] .gb.g4,:root[data-theme="dark"] .gb.g5{color:#06201E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gb.g3,:root:not([data-theme="light"]) .gb.g4,:root:not([data-theme="light"]) .gb.g5{color:#06201E}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-family:var(--f-mono);font-size:1.6rem;font-weight:500;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.82rem}
.hbars{display:flex;flex-direction:column;gap:7px}
.hbar{display:grid;grid-template-columns:minmax(70px,34%) 1fr 36px;gap:8px;align-items:center;font-size:.85rem}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:12px;background:var(--sunk);border-radius:3px;overflow:hidden}
.hbar .fill{display:block;height:100%;background:var(--accent);border-radius:3px}
.hbar .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;height:170px;padding-top:18px;border-bottom:1px solid var(--line)}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.col .bar{width:100%;max-width:56px;border-radius:4px 4px 0 0;min-height:2px}
.col .v{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.collab{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;text-align:center;font-size:.78rem;color:var(--muted);padding-top:6px}
.cloud{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.cloud span{color:var(--accent);font-weight:500;cursor:pointer}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;cursor:pointer}

.item .meta{font-size:.82rem;color:var(--muted)}
.item .kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.bulk{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}

.drop b{font-family:var(--f-display);font-size:1.1rem;display:block;margin-bottom:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.queue{margin-top:14px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}

.prose{line-height:1.8;max-width:72ch}
.prose h2{font-size:1.12rem;margin:1.4em 0 .5em;padding-top:.6em;border-top:1px solid var(--line)}
.prose h2:first-child{margin-top:0;border-top:0;padding-top:0}
.prose h3{font-size:1rem;margin:1.1em 0 .4em}
.prose p{margin:.6em 0}
.prose blockquote{margin:.8em 0;padding:.4em 1em;border-left:3px solid var(--mark);background:var(--sunk);border-radius:0 6px 6px 0}
.prose table{border-collapse:collapse;display:block;overflow-x:auto}
.prose td,.prose th{border:1px solid var(--line);padding:4px 8px}

.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}

.raw{max-height:420px;overflow:auto;white-space:pre-wrap;font-size:.85rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px}

.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-size:1.15rem;color:var(--ink);margin-bottom:6px}
.chapter{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:14px}

.sec{padding:12px;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}

.cnt{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}

.sec .row select{width:auto;flex:0 1 280px}

.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;flex:1 1 120px}
.meter i{display:block;height:100%;background:var(--accent)}
.jobbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 10px 8px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);z-index:20;max-width:calc(100% - 32px);font-size:.88rem}

.modal{position:fixed;inset:0;background:rgba(10,20,20,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal>div{background:var(--surface);border-radius:10px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.note{font-size:.84rem;color:var(--muted);background:var(--sunk);border-radius:6px;padding:8px 12px}
.refs{font-size:.92rem;line-height:1.75}
.btable{border-collapse:collapse;width:100%;font-size:.88rem;min-width:720px}
.btable th,.btable td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}

.refs li{margin-bottom:6px;padding-left:4px}

.check{display:flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.pickl{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:var(--bg)}

.pickl label:last-child{border-bottom:0}
.mobile-nav{display:none}
.app>*{min-width:0}
@media (max-width:900px){ .side{max-width:100vw;width:100%} .app{grid-template-columns:minmax(0,1fr)} }
.projbox{display:flex;flex-direction:column;gap:4px;margin:10px 0 6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}

.nav button[aria-disabled="true"]{opacity:.45}

<script data-app>
(() => {
"use strict";
/* ---------- 상수 ---------- */
const CH = {pdf:"PDF", hwpx:"HWPX", web:"웹", drive:"구글 드라이브", riss:"RISS", kci:"KCI", obsidian:"Obsidian", ai:"AI 생성", manual:"직접 입력"};
const GD="Google Drive", FC="host:firecrawl-mcp";
const KINDS = ["학술논문","학위논문","보고서","단행본","기사","웹문서","강의자료","메모","기타"];
const GL = {5:"핵심",4:"주요",3:"참고",2:"간접",1:"무관",0:"미분류"};
const WKINDS = ["학술논문","학위논문","강의노트"];
const DEPTH = {
  "초급":"쉬운 용어와 짧은 문장, 개념 정의와 예시 중심, 전문용어는 처음 나올 때 풀어서 설명",
  "중급":"표준 학술 문체, 주요 개념 정의와 선행연구 연결, 논리적 단락 구성",
  "고급":"이론 간 논쟁 검토, 비판적 분석, 정교한 논증과 반론 고려",
  "전문가":"해당 분야 전문가 독자 기준, 최신 쟁점과 방법론적 엄밀성, 연구의 독창적 기여를 분명히 서술"
};
const TEXT_LIMIT = 60000;
const NAV = [
  ["home","대문"],["dash","대시보드"],["collect","자료 수집"],["library","자료 라이브러리"],["analysis","종합 분석"],
  ["thesis","내 논문"],["refs","참고문헌"],["write","AI 집필"],["exchange","Obsidian·드라이브"]
];

/* ---------- 상태 ---------- */
const S = {
  sources:[], drafts:[], thesis:{field:"",topic:"",keywords:[],outline:"",insight:""},
  view:"home", all:[], allDrafts:[], projects:[], pid:null,
  np:{name:"", topic:"", field:"", keywords:"", desc:"", drive:true, obs:true}, showNew:false,
  srcId:null, draftId:null, tab:"pdf",
  f:{q:"",topic:"",ch:"",kind:"",grade:"",sort:"new"}, sel:new Set(),
  live:{}, mode:"loading", queue:[], preview:false,
  refOpt:{min:3, style:"apa", attr:true, group:true, mode:"list"},
  drive:{q:"", items:[], picked:new Set(), busy:false, note:""}, acad:{site:"kci", q:"", items:[], busy:false, note:""}, dsync:{q:".md", items:[], busy:false},
  syn:{ids:new Set(), view:"", type:"종합 분석 보고서"},
  exp:{scope:"all", min:1}
};
const cap = {db:null, sample:null, mcp:null, dl:null, assets:null, user:null};

/* ---------- 유틸 ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now = () => new Date().toISOString();
const fmtDate = iso => { try{ const d=new Date(iso); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;}catch{return ""} };
const n = x => Number(x)||0;
const clip = (s,k) => { s=String(s||""); return s.length>k ? s.slice(0,k)+"…" : s; };
function md(s){
  s = String(s||"");
  try{ const h = window.marked ? marked.parse(s) : "<p>"+esc(s).replace(/\n/g,"<br>")+"</p>";
       return window.DOMPurify ? DOMPurify.sanitize(h) : esc(s); }catch{ return "<pre>"+esc(s)+"</pre>"; }
}
let toastT;
function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.className="toast"+(err?" err":""); t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, err?6000:3200); }
function ask(text, okLabel="삭제", danger=true){
  return new Promise(res=>{
    const m=$("#modal");
    m.innerHTML=`<div role="dialog" aria-modal="true"><p>${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="mNo" type="button">취소</button><button class="btn ${danger?"danger solid":"primary"}" id="mOk" type="button">${esc(okLabel)}</button></div></div>`;
    m.hidden=false; $("#mOk").focus();
    const done=v=>{m.hidden=true; m.innerHTML=""; res(v);};
    $("#mNo").onclick=()=>done(false); $("#mOk").onclick=()=>done(true);
    m.onclick=e=>{ if(e.target===m) done(false); };
  });
}
const debouncers = new Map();
function debounce(key, fn, ms=700){ clearTimeout(debouncers.get(key)); debouncers.set(key, setTimeout(fn, ms)); }
function loadScript(src){ return new Promise((ok,no)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>no(new Error("라이브러리를 불러오지 못했습니다: "+src)); document.head.appendChild(s); }); }
async function needPdf(){ if(window.pdfjsLib && window.pdfjsWorker) return; await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"); await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"); }
async function needZip(){ if(window.JSZip) return; await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"); }
const len = s => String(s||"").length;

/* ---------- 저장소 ---------- */
const LKEY = "aiwiki.v1";
const queues = new Map();
function enqueue(key, fn){ const p=(queues.get(key)||Promise.resolve()).then(fn); queues.set(key, p.catch(()=>{})); return p; }
function plain(o){ return JSON.parse(JSON.stringify(o)); }
const PKEY="aiwiki.pid";
function curProj(){ return S.projects.find(p=>p.id===S.pid)||null; }
function byUpd(a,b){ return String(b.updatedAt||b.createdAt||"").localeCompare(String(a.updatedAt||a.createdAt||"")); }
function legacyPid(){ const a=[...S.projects].sort((x,y)=>String(x.createdAt||"").localeCompare(String(y.createdAt||""))); return a[0]?.id||null; }
const pidOf = x => x.pid || legacyPid();
function scope(){
  if(S.pid && !curProj()) S.pid=null;
  S.sources=sortDocs(S.all.filter(s=>pidOf(s)===S.pid));
  S.drafts=S.allDrafts.filter(d=>pidOf(d)===S.pid).sort(byUpd);
  const p=curProj();
  if(p){ p.thesis={field:"",topic:"",keywords:[],outline:"",insight:"", ...(p.thesis||{})}; S.thesis=p.thesis; }
  else S.thesis={field:"",topic:"",keywords:[],outline:"",insight:""};
}
function restorePid(){ let id=null; try{ id=localStorage.getItem(PKEY); }catch{} if(id && S.projects.some(p=>p.id===id)) S.pid=id; }
function setProject(id){
  S.pid=id; try{ id?localStorage.setItem(PKEY,id):localStorage.removeItem(PKEY); }catch{}
  S.sel.clear(); S.srcId=null; S.draftId=null; S.syn={ids:new Set(), view:"", type:"종합 분석 보고서"};
  S.drive.items=[]; S.drive.picked=new Set(); S.drive.note=""; S.acad.items=[]; S.acad.note=""; S.queue=[];
  scope();
}
function persistLocal(){ if(S.mode==="db") return; try{ localStorage.setItem(LKEY, JSON.stringify({v:2, projects:S.projects, sources:S.all, drafts:S.allDrafts})); }catch(e){ toast("브라우저 저장 공간이 부족합니다. 데이터를 JSON으로 내보내 백업하세요.", true); } }
function upgradeLegacy(j){
  if(j.projects) return j;
  const t=j.thesis||{}; const pid="p_"+uid();
  if(!(j.sources||[]).length && !(j.drafts||[]).length && !t.topic) return {projects:[], sources:[], drafts:[]};
  return {projects:[{id:pid, name:t.topic?clip(t.topic,40):"내 첫 프로젝트", desc:"", thesis:t, folders:{}, createdAt:now(), updatedAt:now()}],
    sources:(j.sources||[]).map(s=>({...s, pid:s.pid||pid})), drafts:(j.drafts||[]).map(d=>({...d, pid:d.pid||pid}))};
}
function loadLocal(){ try{ let j=null; try{ j=JSON.parse(localStorage.getItem(LKEY)||"null"); }catch{} if(!j && window.AIWIKI_SEED) j=window.AIWIKI_SEED; if(j){ j=upgradeLegacy(j); S.projects=j.projects||[]; S.all=j.sources||[]; S.allDrafts=j.drafts||[]; } }catch{} restorePid(); scope(); }
function dbErr(e){ const c=e&&e.code; if(c==="quota_exceeded") toast("저장 용량이 가득 찼습니다. 쓰지 않는 자료를 삭제하세요.", true); else if(c==="invalid_argument") toast("저장하지 못했습니다(문서가 너무 크거나 권한이 없습니다).", true); else toast("저장 중 문제가 생겼습니다. 잠시 후 다시 시도하세요.", true); }
const Store = {
  saveSource(src){
    src.pid=src.pid||S.pid; src.updatedAt=now();
    const i=S.all.findIndex(x=>x.id===src.id); if(i<0) S.all.unshift(src); else S.all[i]=src; scope();
    if(S.mode==="db"){ const {id,...body}=src; return enqueue("s/"+id, ()=>cap.db.doc("sources/"+id).set(plain(body))).catch(dbErr); }
    persistLocal(); return Promise.resolve();
  },
  deleteSource(id){
    S.all=S.all.filter(x=>x.id!==id); S.sel.delete(id); scope();
    if(S.mode==="db") return enqueue("s/"+id, ()=>cap.db.doc("sources/"+id).delete()).catch(dbErr);
    persistLocal(); return Promise.resolve();
  },
  saveDraft(d){
    d.pid=d.pid||S.pid; d.updatedAt=now();
    const i=S.allDrafts.findIndex(x=>x.id===d.id); if(i<0) S.allDrafts.unshift(d); else S.allDrafts[i]=d; scope();
    if(S.mode==="db"){ const {id,...body}=d; return enqueue("d/"+id, ()=>cap.db.doc("drafts/"+id).set(plain(body))).catch(dbErr); }
    persistLocal(); return Promise.resolve();
  },
  deleteDraft(id){
    S.allDrafts=S.allDrafts.filter(x=>x.id!==id); scope();
    if(S.mode==="db") return enqueue("d/"+id, ()=>cap.db.doc("drafts/"+id).delete()).catch(dbErr);
    persistLocal(); return Promise.resolve();
  },
  saveProject(p){
    p.updatedAt=now();
    const i=S.projects.findIndex(x=>x.id===p.id); if(i<0) S.projects.unshift(p); else S.projects[i]=p; scope();
    if(S.mode==="db"){ const {id,...body}=p; return enqueue("p/"+id, ()=>cap.db.doc("projects/"+id).set(plain(body))).catch(dbErr); }
    persistLocal(); return Promise.resolve();
  },
  deleteProject(id){
    S.projects=S.projects.filter(x=>x.id!==id); if(S.pid===id) setProject(null); else scope();
    if(S.mode==="db") return enqueue("p/"+id, ()=>cap.db.doc("projects/"+id).delete()).catch(dbErr);
    persistLocal(); return Promise.resolve();
  },
  saveThesis(){ const p=curProj(); if(!p) return Promise.resolve(); p.thesis=S.thesis; return Store.saveProject(p); }
};
function sortDocs(arr){ return arr.sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||""))); }
async function boot(){
  render();
  const c = window.claude;
  const use = name => (c && c.use) ? c.use(name).catch(()=>null) : Promise.resolve(null);
  const [db,sample,mcp,dl,assets,user] = await Promise.all(["db","sample","mcp","downloads","assets","user"].map(use));
  Object.assign(cap,{db,sample,mcp,dl,assets,user});
  let owner = false; try{ owner = user ? await user.isOwner() : false; }catch{}
  if(db && owner){
    S.mode="db"; let first=3;
    const settle=()=>{ scope(); if(first>0 && --first===0){ if(S.pid && S.view==="home" && !S.homePinned) S.view="home"; render(); } else softRender(); };
    db.collection("projects").onSnapshot(snap=>{ S.projects=snap.docs.map(d=>({...d.data(), id:d.id})); if(!S.pid) restorePid(); settle(); }, e=>toast("프로젝트 목록 동기화가 끊겼습니다. 새로고침하세요.", true));
    db.collection("sources").onSnapshot(snap=>{ S.all=snap.docs.map(d=>({...d.data(), id:d.id})); settle(); }, e=>toast("자료 목록 동기화가 끊겼습니다. 새로고침하세요.", true));
    db.collection("drafts").onSnapshot(snap=>{ S.allDrafts=snap.docs.map(d=>({...d.data(), id:d.id})); settle(); }, e=>{});
  } else {
    S.mode = db && !owner ? "guest" : "local"; loadLocal(); render();
  }
  renderStore();
}
function renderStore(){
  const el=$("#store"); const ai = cap.sample ? "사용 가능" : "이 화면에서 사용 불가";
  const m = {db:['on',"클라우드 저장 (소유자 전용)"], local:['local',"이 브라우저에만 저장"], guest:['local',"열람자 모드: 이 브라우저에만 저장"], loading:['',"저장소 연결 중"]}[S.mode];
  el.innerHTML=`<div><span class="dot ${m[0]}"></span>${m[1]}</div><div>AI 기능: ${ai}</div><div>구글 드라이브·웹·RISS·KCI: ${cap.mcp?"연결 시도 가능":"사용 불가"}</div>`;
}

  prompt_too_large:"보낼 자료가 너무 깁니다. 자료 수를 줄여 다시 시도하세요.",
  invalid_json:"AI 응답 형식을 읽지 못했습니다. 다시 시도하세요.",

};
function aiErr(e){ if(!e || e.code==="cancelled") return; toast(AI_ERR[e.code] || (e.message && !e.code ? e.message : "AI 연결이 잠시 끊겼습니다. 다시 시도하세요."), true); }
function requireAI(){ if(!cap.sample){ toast("AI 기능은 Claude 앱이나 claude.ai에서 이 페이지를 열 때 사용할 수 있습니다.", true); return false; } if(job){ toast("다른 AI 작업이 진행 중입니다. 끝난 뒤 다시 시도하세요."); return false;} return true; }

function thesisBlock(){
  const t=S.thesis;
  if(!t.topic && !(t.keywords||[]).length && !t.outline) return "[내 논문]\n(아직 입력되지 않음)";
  return `[내 논문]\n분야: ${t.field||"-"}\n주제: ${t.topic||"-"}\n키워드: ${(t.keywords||[]).join(", ")||"-"}\n개요:\n${clip(t.outline||"-",3000)}`;
}

function srcBrief(s, i, k=700){
  return `[S${i}] ${s.title} — ${cite(s)}${s.publisher?" / "+s.publisher:""} / 관련도 ${s.grade||"?"}등급 / 주제 ${s.topic||"-"}
요약: ${s.summary||clip(s.text,400)}
${s.myView?"연구자 관점: "+clip(s.myView,400)+"\n":""}${s.touch?"논문 접점: "+clip(s.touch,300)+"\n":""}${s.analysis?"분석 발췌: "+clip(s.analysis.replace(/\n+/g," "),k):""}`;
}

/* 분류 */
async function classify(src, signal, tier="default"){
  const topics=[...new Set(S.sources.map(s=>s.topic).filter(Boolean))].slice(0,30);
  const prompt=`너는 학술 연구 사서이자 논문 지도교수다. 아래 자료를 분류하고 내 논문과의 관련도를 평가하라.

${thesisBlock()}

[기존 주제 분류] ${topics.join(", ")||"(없음)"}
가능하면 기존 주제 중에서 고르고, 맞는 것이 없을 때만 새 주제를 만든다.

[자료]
제목: ${src.title}
수집 경로: ${CH[src.ch]||src.ch}
${src.url?"URL: "+src.url+"\n":""}본문 앞부분:
${String(src.text||"").slice(0,7000)}

[관련도 등급 기준]
5 핵심: 내 논문의 핵심 주장이나 방법에 직접 인용할 자료

  const j = await aiJSON(prompt,{signal, tier});

async function classifyMany(list){
  if(!list.length){ toast("분류할 자료가 없습니다."); return; }
  if(!requireAI()) return;
  const signal=jobStart(`AI 분류 0/${list.length}`); let ok=0;
  try{
    for(let i=0;i<list.length;i++){
      if(signal.aborted) break;
      jobLabel(`AI 분류 ${i+1}/${list.length} · ${clip(list[i].title,24)}`);
      const s = S.sources.find(x=>x.id===list[i].id); if(!s) continue;
      const c = {...s};
      await classify(c, signal, list.length>3?"quick":"default");
      await Store.saveSource(c); ok++; softRender();
    }
    toast(`${ok}건을 분류했습니다.`);
  }catch(e){ aiErr(e); }
  finally{ jobEnd(); softRender(); }
}

function newSource(o){ return {id:uid(), title:"제목 없음", ch:"manual", kind:"", text:"", url:"", author:"", year:"", publisher:"", topic:"", keywords:[], grade:0, gradeReason:"", summary:"", myView:"", analysis:"", touch:"", insight:"", createdAt:now(), ...o}; }
function trimText(t){ t=String(t||"").replace(/\u0000/g,"").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim(); return t.length>TEXT_LIMIT ? {text:t.slice(0,TEXT_LIMIT), cut:t.length} : {text:t, cut:0}; }
async function pdfText(file){
  await needPdf();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  let out=[], meta={};
  try{ const m=await pdf.getMetadata(); meta={title:m?.info?.Title||"", author:m?.info?.Author||""}; }catch{}
  for(let p=1;p<=pdf.numPages;p++){
    const pg = await pdf.getPage(p); const tc = await pg.getTextContent();
    let line="", lines=[]; let lastY=null;
    for(const it of tc.items){ const y=it.transform?it.transform[5]:0; if(lastY!==null && Math.abs(y-lastY)>2){ lines.push(line); line=""; } line+=it.str; lastY=y; }
    lines.push(line);
    out.push(`[p.${p}]\n`+lines.join("\n"));
    if(out.join("\n").length>TEXT_LIMIT*1.2) { out.push(`[이하 ${pdf.numPages-p}쪽 생략]`); break; }
  }
  return {text:out.join("\n\n"), pages:pdf.numPages, meta};
}
async function hwpxText(file){
  await needZip();
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const names = Object.keys(zip.files).filter(k=>/^Contents\/section\d+\.xml$/i.test(k)).sort((a,b)=>n(a.match(/\d+/)[0])-n(b.match(/\d+/)[0]));
  let parts=[];
  for(const nm of names){
    const xml = await zip.file(nm).async("string");
    const doc = new DOMParser().parseFromString(xml,"application/xml");
    const paras = doc.getElementsByTagNameNS("*","p");
    for(const p of paras){ const ts=p.getElementsByTagNameNS("*","t"); let s=""; for(const t of ts) s+=t.textContent; if(s.trim()) parts.push(s); }
  }
  if(!parts.length && zip.file("Preview/PrvText.txt")) parts=[await zip.file("Preview/PrvText.txt").async("string")];
  let title="";
  const hdr = zip.file("Contents/content.hpf");
  if(hdr){ const x=await hdr.async("string"); const m=x.match(/<opf:title>([^<]*)<\/opf:title>/); if(m) title=m[1]; }
  return {text:parts.join("\n"), title};
}
async function ingestFiles(files, kind){
  const auto = $("#optAuto")?.checked ?? true;
  const keep = $("#optKeep")?.checked ?? false;
  const made=[];
  for(const f of files){
    const q={name:f.name, st:"읽는 중"}; S.queue.unshift(q); renderQueue();
    try{
      const ext=f.name.split(".").pop().toLowerCase();
      let src;
      if(ext==="pdf"){
        const r=await pdfText(f); const t=trimText(r.text);
        src=newSource({ch:"pdf", title:r.meta.title && r.meta.title.length>3 ? r.meta.title : f.name.replace(/\.pdf$/i,""), author:r.meta.author||"", text:t.text, fileName:f.name, pages:r.pages, cut:t.cut});
        if(!t.text.trim()) q.note="본문 텍스트가 없습니다(스캔 이미지 PDF일 수 있음)";
        if(keep && cap.assets){
          q.st="원문 보관 중"; renderQueue();
          try{ const up=await cap.assets.upload(f,{type:"application/pdf"}); src.pdfAsset=up.id; }
          catch(e){ q.note=(e.code==="too_large"?"원문이 20MB를 넘어 보관하지 못했습니다":"원문 보관 실패"); }
        }
      } else if(ext==="hwpx"){
        const r=await hwpxText(f); const t=trimText(r.text);
        src=newSource({ch:"hwpx", title:r.title||f.name.replace(/\.hwpx$/i,""), text:t.text, fileName:f.name, cut:t.cut});
      } else if(ext==="hwp"){
        throw new Error("HWP(구버전)는 읽을 수 없습니다. 한글에서 HWPX로 저장해 올려 주세요.");
      } else { throw new Error("지원하지 않는 형식입니다"); }
      await Store.saveSource(src); made.push(src);
      q.st="저장됨"; q.id=src.id; renderQueue();
    }catch(e){ q.st="실패"; q.note=e.message||String(e); renderQueue(); }
  }
  softRender();
  if(auto && made.length && cap.sample) await classifyMany(made);
}
async function scrapeWeb(url){
  if(!cap.mcp) throw {code:"no_mcp"};
  const r = await cap.mcp.callTool("host:firecrawl-mcp","firecrawl_scrape",{url, formats:["markdown"], onlyMainContent:true});
  let p=r.payload, mdx="", title="";
  if(typeof p==="string"){ mdx=p; }
  else if(p && typeof p==="object"){ mdx=p.markdown||p.data?.markdown||p.content||""; title=p.metadata?.title||p.data?.metadata?.title||p.title||""; }
  if(!mdx) mdx=(r.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  try{ const j=JSON.parse(mdx); if(j && j.markdown){ mdx=j.markdown; title=title||j.metadata?.title||""; } }catch{}
  if(!title){ const m=mdx.match(/^#\s+(.+)$/m); if(m) title=m[1].trim(); }
  return {md:mdx, title};
}

/* ---------- 연결 도구(MCP) 공통 ---------- */
function payloadOf(r){ let p=r?.payload; if(p==null) p=(r?.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n"); if(typeof p==="string"){ try{ return JSON.parse(p); }catch{} } return p; }
function findItems(o, test, out=[], d=0){ if(o==null||d>7) return out; if(typeof o==="string"){ if(d<2){ try{ findItems(JSON.parse(o),test,out,d+1); }catch{} } return out; } if(Array.isArray(o)){ for(const x of o) findItems(x,test,out,d+1); return out; } if(typeof o==="object"){ if(test(o)) out.push(o); else for(const v of Object.values(o)) findItems(v,test,out,d+1); } return out; }
const schemaCache={};
const ALIAS={query:/^(query|q|search|search_?query|keywords?|term)$/i, id:/^(file_?id|id|document_?id|drive_?file_?id)$/i, title:/^(title|name|file_?name)$/i, content:/^(content|text|body|data|file_?content)$/i, mime:/^(mime_?type|content_?type)$/i, limit:/^(limit|page_?size|max_?results|n|count)$/i, parent:/^(parent|parent_?id|folder_?id|parents)$/i};
const DEF={query:"query", id:"fileId", title:"title", content:"content", mime:"mimeType", limit:"pageSize", parent:"parentId"};
async function argsFor(server, tool, want){
  if(!(tool in schemaCache)){ try{ schemaCache[tool]=(await cap.mcp.describeTool(server,tool))?.inputSchema?.properties||null; }catch{ schemaCache[tool]=null; } }
  const props=schemaCache[tool], out={};
  for(const [k,v] of Object.entries(want)){ if(v==null||v==="") continue; let key=DEF[k];
    if(props){ const hit=Object.keys(props).find(x=>ALIAS[k].test(x)); if(hit) key=hit; else if(k!=="query"&&k!=="id"&&k!=="title"&&k!=="content") continue; }
    else if(k==="limit"||k==="parent") continue;
    if(props && props[key] && props[key].type==="array" && !Array.isArray(v)) v=[v];
    out[key]=v; }
  return out;
}
async function mcall(server, tool, want){ if(!cap.mcp) throw {code:"no_mcp"}; return cap.mcp.callTool(server, tool, await argsFor(server, tool, want), {cache:false}); }
const DRIVE_ERR={server_not_connected:"Google Drive가 연결되어 있지 않습니다. claude.ai 설정 → 커넥터에서 Google Drive를 연결한 뒤 다시 시도하세요.", needs_reauth:"Google Drive를 다시 연결해야 합니다. claude.ai 설정 → 커넥터에서 다시 연결하세요.", not_in_manifest:"이 페이지의 Google Drive 사용이 허용되지 않았습니다. 페이지 권한에서 허용하세요.", selection_required:"연결된 Google Drive 계정이 여러 개입니다. 표시되는 창에서 하나를 고르세요.", blocked_by_policy:"조직 정책으로 Google Drive 사용이 막혀 있습니다.", tool_error:"Google Drive가 요청을 처리하지 못했습니다.", server_unavailable:"Google Drive가 잠시 응답하지 않습니다. 잠시 후 다시 시도하세요.", no_mcp:"이 화면에서는 연결 도구를 쓸 수 없습니다. Claude 앱이나 claude.ai에서 여세요."};
const isDriveFile = o => (o.id||o.fileId) && (o.name||o.title);
function driveName(f){ return String(f.name||f.title||"이름 없음"); }
function driveId(f){ return String(f.id||f.fileId); }
async function driveSearch(q){
  const tries=[q, `fullText contains '${q.replace(/'/g,"")}'`];
  let lastErr=null;
  for(const query of tries){
    try{ const r=await mcall(GD,"search_files",{query, limit:50}); const items=findItems(payloadOf(r), isDriveFile); if(items.length) return items; }
    catch(e){ lastErr=e; if(e.code && e.code!=="tool_error") throw e; }
  }
  if(lastErr) throw lastErr; return [];
}
async function driveFind(){
  const D=S.drive; if(D.busy) return;
  const t=S.thesis; const kws=(D.q.trim()? D.q.split(/[,，;；]/) : [t.topic, ...(t.keywords||[])]).map(x=>String(x||"").trim()).filter(Boolean).slice(0,8);
  if(!kws.length){ toast("검색어를 입력하거나 '내 논문'에 주제와 키워드를 입력하세요."); return; }
  D.busy=true; D.items=[]; D.picked=new Set(); D.note="드라이브 검색 중…"; render();
  try{
    const seen=new Map();
    for(const k of kws){ D.note=`드라이브 검색 중… '${clip(k,20)}'`; softRender(); for(const f of await driveSearch(k)){ const id=driveId(f); if(!seen.has(id)) seen.set(id,{id, name:driveName(f), mime:String(f.mimeType||f.mime_type||""), modified:String(f.modifiedTime||f.modified_time||""), hit:k}); } }
    let list=[...seen.values()].filter(f=>!/folder|shortcut|image\/|video\/|audio\//i.test(f.mime));
    const have=new Set(S.sources.map(s=>s.driveId).filter(Boolean)); list.forEach(f=>f.have=have.has(f.id));
    if(list.length && cap.sample){
      D.note=`후보 ${list.length}건 중 관련 자료 20건을 AI가 고르는 중…`; softRender();
      try{
        const j=await aiJSON(`너는 연구 사서다. 아래 구글 드라이브 파일 목록에서 내 논문과 관련성이 높은 파일을 최대 20개 골라 관련도 순으로 정렬하라.\n\n${thesisBlock()}\n\n[파일 목록]\n${list.slice(0,150).map((f,i)=>`${i+1}. ${f.name} (${f.mime||"?"}) — 검색어: ${f.hit}`).join("\n")}\n\nJSON만 답하라: {"picks":[{"no":번호,"score":1~5,"reason":"한 줄 근거"}]}`,{tier:"quick"});
        const picks=(j.picks||[]).map(p=>({...list[n(p.no)-1], score:n(p.score), reason:String(p.reason||"")})).filter(x=>x.id);
        const rest=list.filter(f=>!picks.some(p=>p.id===f.id));
        list=[...picks, ...rest];
        picks.slice(0,20).forEach(p=>{ if(!p.have) D.picked.add(p.id); });
      }catch(e){ list.slice(0,20).forEach(f=>{ if(!f.have) D.picked.add(f.id); }); }
    } else list.slice(0,20).forEach(f=>{ if(!f.have) D.picked.add(f.id); });
    D.items=list; D.note=list.length?`${list.length}건을 찾았습니다. 관련도가 높은 ${D.picked.size}건을 골라 두었습니다.`:"검색 결과가 없습니다. 검색어를 바꿔 보세요.";
  }catch(e){ D.note=DRIVE_ERR[e.code]||"드라이브를 검색하지 못했습니다."; toast(D.note,true); }
  finally{ D.busy=false; render(); }
}
function textOfRead(r){
  const p=payloadOf(r);
  if(typeof p==="string") return p;
  if(p && typeof p==="object"){ for(const k of ["content","text","markdown","body","data"]) if(typeof p[k]==="string") return p[k]; }
  return (r?.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
}
async function driveImport(){
  const D=S.drive; const pick=D.items.filter(f=>D.picked.has(f.id)); if(!pick.length){ toast("가져올 파일을 고르세요."); return; }
  D.busy=true; render(); const made=[];
  for(let i=0;i<pick.length;i++){ const f=pick[i]; D.note=`가져오는 중 ${i+1}/${pick.length} · ${clip(f.name,30)}`; softRender();
    try{ const r=await mcall(GD,"read_file_content",{id:f.id}); const t=trimText(textOfRead(r)); if(!t.text) throw {code:"empty"};
      const ex=S.sources.find(s=>s.driveId===f.id);
      if(/\.md$/i.test(f.name)){ await importMd(f.name, t.text, {driveId:f.id}); continue; }
      const src=ex?{...ex, text:t.text, cut:t.cut}:newSource({ch:"drive", title:f.name.replace(/\.(pdf|docx?|hwpx?|txt|md|gdoc)$/i,""), text:t.text, cut:t.cut, fileName:f.name, driveId:f.id, kind:/pdf/i.test(f.mime)?"":"기타"});
      await Store.saveSource(src); if(!ex) made.push(src); f.have=true; D.picked.delete(f.id);
    }catch(e){ S.queue.unshift({name:f.name, st:"실패", note:e.code==="empty"?"본문을 읽지 못했습니다":(DRIVE_ERR[e.code]||"읽기 실패")}); }
  }
  D.busy=false; D.note=`${made.length}건을 새로 가져왔습니다.`; render();
  if(made.length && cap.sample) classifyMany(made);
}

async function acadSearch(){
  const A=S.acad; if(A.busy) return; const site=ACAD[A.site];
  const q=(A.q.trim()||[S.thesis.topic,...(S.thesis.keywords||[]).slice(0,2)].filter(Boolean).join(" ")).trim();
  if(!q){ toast("검색어를 입력하세요."); return; }
  A.busy=true; A.items=[]; A.note=`${site.label}에서 '${clip(q,30)}' 검색 중…`; render();
  try{
    const url = A.site==="riss"
      ? `https://www.riss.kr/search/Search.do?isDetailSearch=N&searchGubun=true&viewYn=OP&colName=re_a_kor&query=${encodeURIComponent(q)}`
      : `https://www.kci.go.kr/kciportal/po/search/poTotalSearList.kci?sereArticleSearchBean.searType=all&sereArticleSearchBean.searText=${encodeURIComponent(q)}`;
    const r=await cap.mcp.callTool(FC,"firecrawl_scrape",{url, formats:["markdown","links"], onlyMainContent:true}, {cache:false});
    let pl=payloadOf(r); let md = typeof pl==="string" ? pl : (pl?.markdown||pl?.data?.markdown||JSON.stringify(pl||""));
    let items=[];
    if(cap.sample){
      A.note="검색 결과를 정리하는 중…"; softRender();
      const j=await aiJSON(`아래는 ${site.label} 논문 검색 결과 페이지다. 검색된 논문 목록을 추출하라. 상세 페이지 URL은 페이지에 있는 링크를 그대로 쓰고, 상대 경로면 https://www.${site.host}를 붙인다.\n\n${String(md).slice(0,40000)}\n\nJSON만 답하라: {"papers":[{"title":"","author":"","year":"","publisher":"학술지·발행기관","url":"상세 페이지 URL","abstract":"결과에 보이는 초록 일부(없으면 빈 문자열)"}]}`,{tier:"quick"});
      items=(j.papers||[]).filter(x=>x&&x.title);
    } else {
      items=findItems(pl, o=>typeof o.url==="string" && o.title).map(o=>({title:o.title, url:o.url}));
    }
    A.items=items.slice(0,20).map(o=>({url:String(o.url||url), title:String(o.title), desc:[o.author,o.year,o.publisher].filter(Boolean).join(" · ")+(o.abstract?" — "+o.abstract:""), meta:o, have:S.sources.some(s=>s.title===o.title)}));
    A.note=A.items.length?`${A.items.length}건을 찾았습니다. '초록 가져오기'를 누르면 서지 정보와 초록을 저장합니다.`:"검색 결과가 없습니다. 검색어를 바꾸거나 아래에 초록을 붙여 넣으세요.";
  }catch(e){ A.note=MCP_ERR[e.code]||"검색하지 못했습니다. 아래에 초록을 붙여 넣어 저장할 수 있습니다."; toast(A.note,true); }
  finally{ A.busy=false; render(); }
}
async function acadExtract(raw, hint){
  return aiJSON(`아래는 ${hint} 논문 정보 페이지 또는 검색 결과에서 가져온 텍스트다. 논문별 서지 정보와 초록을 추출하라. 텍스트에 없는 값은 빈 문자열로 둔다. 초록은 원문 그대로 옮긴다.

[텍스트]
${String(raw).slice(0,30000)}

JSON만 답하라: {"papers":[{"title":"논문 제목","author":"저자(여러 명이면 쉼표)","year":"발행연도 4자리","publisher":"학술지명 또는 발행기관","volume":"권(호)","kind":"학술논문|학위논문|보고서|기타","abstract":"초록","keywords":["저자 키워드"],"url":"논문 상세 URL(있으면)"}]}`,{tier:"quick"});
}
async function saveAcad(papers, ch, fallbackUrl){
  const made=[];
  for(const p of (papers||[])){ if(!p || !(p.title||p.abstract)) continue;
    const url=String(p.url||fallbackUrl||""); if(url && S.sources.some(s=>s.url===url && s.title===p.title)) continue;
    const text=`[초록]\n${p.abstract||"(초록 없음)"}\n\n[서지]\n${p.author||""} (${p.year||""}). ${p.title||""}. ${p.publisher||""}${p.volume?", "+p.volume:""}.\n${url}`;
    const src=newSource({ch, title:String(p.title||"제목 없음"), author:String(p.author||""), year:String(p.year||""), publisher:[p.publisher,p.volume].filter(Boolean).join(", "), kind:KINDS.includes(p.kind)?p.kind:"학술논문", url, text, keywords:Array.isArray(p.keywords)?p.keywords.map(String).slice(0,10):[], abstract:String(p.abstract||"")});
    await Store.saveSource(src); made.push(src); S.queue.unshift({name:src.title, st:"저장됨", id:src.id});
  }
  return made;
}
async function acadFetch(url){
  if(!requireAI()) return; const A=S.acad; const site=ACAD[A.site];
  const signal=jobStart(`${site.label} 초록 가져오는 중`);
  try{
    const r=await cap.mcp.callTool(FC,"firecrawl_scrape",{url, formats:["markdown"], onlyMainContent:true},{signal, cache:false});
    let md=payloadOf(r); if(md && typeof md==="object") md=md.markdown||md.data?.markdown||JSON.stringify(md);
    const j=await acadExtract(md, site.label); const papers=(j.papers||[]).slice(0,1).map(p=>({...p, url:p.url||url}));
    const made=await saveAcad(papers, A.site, url);
    const it=A.items.find(x=>x.url===url); if(it) it.have=true;
    toast(made.length?"초록을 저장했습니다.":"이 페이지에서 초록을 찾지 못했습니다.", !made.length);
    if(made.length) setTimeout(()=>classifyMany(made),0);
  }catch(e){ if(e.code&&MCP_ERR[e.code]) toast(MCP_ERR[e.code],true); else aiErr(e); }
  finally{ jobEnd(); render(); }
}
async function acadPaste(){
  const raw=$("#acadPaste")?.value.trim(); if(!raw){ toast("RISS·KCI에서 복사한 초록이나 내보내기 텍스트를 붙여 넣으세요."); return; }
  if(!requireAI()) return; const A=S.acad;
  const signal=jobStart(`${ACAD[A.site].label} 초록 정리 중`);
  try{ const j=await acadExtract(raw, ACAD[A.site].label); const made=await saveAcad(j.papers, A.site, ""); toast(`${made.length}건을 저장했습니다.`); const el=$("#acadPaste"); if(el) el.value=""; if(made.length) setTimeout(()=>classifyMany(made),0); }
  catch(e){ aiErr(e); }
  finally{ jobEnd(); render(); }
}

/* ---------- 참고문헌 ---------- */
function authorsKR(a){ return a||"저자 미상"; }
function fmtRef(s, style){
  const a=authorsKR(s.author), y=s.year||"n.d.", t=s.title||"제목 없음", p=s.publisher||"", u=s.url||"";
  const ko=/[가-힣]/.test(t);
  switch(style){
    case "kci": return ko ? `${a}(${y}), 「${t}」${p?`, 『${p}』`:""}.${u?` ${u}`:""}` : `${a}(${y}), "${t}"${p?`, ${p}`:""}.${u?` ${u}`:""}`;
    case "chicago": return `${a}. ${y}. "${t}."${p?` ${p}.`:""}${u?` ${u}.`:""}`;
    case "mla": return `${a}. "${t}."${p?` ${p},`:""} ${y}.${u?` ${u}.`:""}`;
    default: return `${a} (${y}). ${t}.${p?` ${p}.`:""}${u?` ${u}`:""}`;
  }
}
function srcAttr(s){ const parts=[CH[s.ch]||s.ch]; if(s.fileName) parts.push(s.fileName); if(s.url) parts.push(s.url); if(s.kind) parts.push(s.kind); return parts.join(" · "); }
function refList(){ return S.sources.filter(s=>n(s.grade)>=S.refOpt.min && s.ch!=="ai").sort((a,b)=> n(b.grade)-n(a.grade) || authorsKR(a.author).localeCompare(authorsKR(b.author),"ko")); }
function refsText(withGrade=true){
  const L=refList(), o=S.refOpt; let out=[];
  const one = s => fmtRef(s,o.style) + (o.attr?`  [출처: ${srcAttr(s)}]`:"") + (withGrade?`  (관련도 ${s.grade}등급)`:"");
  if(o.group){ for(const g of [5,4,3,2,1]){ const a=L.filter(s=>n(s.grade)===g); if(a.length){ out.push(`■ ${g}등급 · ${GL[g]} (${a.length}건)`); a.forEach(s=>out.push(one(s))); out.push(""); } } }
  else { const a=[...L].sort((x,y)=>authorsKR(x.author).localeCompare(authorsKR(y.author),"ko")); a.forEach(s=>out.push(one(s))); }
  return out.join("\n").trim();
}

function draftMarkdown(d, withRefs=true){

}

function parseFrontmatter(txt){
  const m=txt.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/); if(!m) return {fm:{}, body:txt};
  const fm={}; let lastKey=null;
  for(const line of m[1].split("\n")){
    const li=line.match(/^\s*-\s+(.*)$/); if(li && lastKey){ (fm[lastKey]=Array.isArray(fm[lastKey])?fm[lastKey]:[]).push(li[1].replace(/^["']|["']$/g,"")); continue; }
    const kv=line.match(/^([\w\-]+):\s*(.*)$/); if(!kv) continue; lastKey=kv[1]; let v=kv[2].trim();
    if(/^\[.*\]$/.test(v)) v=v.slice(1,-1).split(",").map(x=>x.trim().replace(/^["']|["']$/g,"")).filter(Boolean);
    else v=v.replace(/^["']|["']$/g,"");
    fm[lastKey]=v===""?[]:v;
  }
  return {fm, body:txt.slice(m[0].length)};
}
async function importMd(name, txt, extra={}){
  const {fm, body}=parseFrontmatter(txt);
  const h=body.match(/^#\s+(.+)$/m);
  const title=fm.title||(h?h[1].trim():"")||name.replace(/\.(md|txt)$/i,"");
  const tags=[...(Array.isArray(fm.tags)?fm.tags:fm.tags?[fm.tags]:[]), ...[...body.matchAll(/(^|\s)#([\p{L}\d_\-\/]+)/gu)].map(m=>m[2])];
  const t=trimText(body);
  const exist = fm.aiwiki_id && S.sources.find(x=>x.id===fm.aiwiki_id);
  const base = exist ? {...exist} : newSource({});
  Object.assign(base,{ch:exist?exist.ch:"obsidian", title, text:exist?exist.text:t.text, keywords:[...new Set(tags)].slice(0,12), fileName:name, ...extra});
  if(fm.grade) base.grade=n(fm.grade); if(fm.topic) base.topic=fm.topic; if(fm.author) base.author=fm.author; if(fm.year) base.year=fm.year; if(fm.url) base.url=fm.url; if(fm.publisher) base.publisher=fm.publisher;
  await Store.saveSource(base); return !!exist;
}
async function importExchange(files){

      if(ext==="json"){
        const j=JSON.parse(txt);
        if(j && j.app==="AI WIKI"){
          for(const s of (j.sources||[])){ const ex=S.all.find(x=>x.id===s.id); const other=ex && pidOf(ex)!==S.pid; await Store.saveSource({...newSource({}), ...s, pid:S.pid, id:other?uid():(s.id||uid())}); restored++; }
          for(const d of (j.drafts||[])){ const ex=S.allDrafts.find(x=>x.id===d.id); await Store.saveDraft({...d, pid:S.pid, id:(ex && pidOf(ex)!==S.pid)?uid():(d.id||uid())}); }
          if(j.thesis && !S.thesis.topic){ S.thesis={...S.thesis, ...j.thesis}; await Store.saveThesis(); }
        } else {
          const arr=Array.isArray(j)?j:(j.notes||j.items||[j]);
          for(const o of arr){ const t=trimText(o.content||o.text||o.body||""); await Store.saveSource(newSource({ch:"obsidian", title:o.title||o.name||f.name, text:t.text, keywords:Array.isArray(o.tags)?o.tags:[], fileName:f.name})); made++; }
        }
      } else if(ext==="md"||ext==="txt"){
        (await importMd(f.name, txt)) ? restored++ : made++;
      } else if(false){
        const {fm, body}=parseFrontmatter(txt);
        const h=body.match(/^#\s+(.+)$/m);
        const title=fm.title||(h?h[1].trim():"")||f.name.replace(/\.(md|txt)$/i,"");
        const tags=[...(Array.isArray(fm.tags)?fm.tags:fm.tags?[fm.tags]:[]), ...[...body.matchAll(/(^|\s)#([\p{L}\d_\-\/]+)/gu)].map(m=>m[2])];
        const t=trimText(body);
        const exist = fm.aiwiki_id && S.sources.find(x=>x.id===fm.aiwiki_id);
        const base = exist ? {...exist} : newSource({});
        Object.assign(base,{ch:exist?exist.ch:"obsidian", title, text:exist?exist.text:t.text, keywords:[...new Set(tags)].slice(0,12), fileName:f.name});
        if(fm.grade) base.grade=n(fm.grade); if(fm.topic) base.topic=fm.topic; if(fm.author) base.author=fm.author; if(fm.year) base.year=fm.year; if(fm.url) base.url=fm.url; if(fm.publisher) base.publisher=fm.publisher;
        await Store.saveSource(base); exist?restored++:made++;
      } else if(ext==="html"||ext==="htm"){
        const doc=new DOMParser().parseFromString(txt,"text/html");
        doc.querySelectorAll("script,style,nav,footer").forEach(x=>x.remove());
        const t=trimText(doc.body?.innerText||doc.body?.textContent||"");
        await Store.saveSource(newSource({ch:"obsidian", title:doc.title||f.name, text:t.text, fileName:f.name})); made++;
      } else { toast(`${f.name}: 지원하지 않는 형식입니다.`, true); }
    }catch(e){ toast(`${f.name}: 읽지 못했습니다 (${e.message||"형식 오류"})`, true); }
  }
  toast(`새 자료 ${made}건, 갱신·복원 ${restored}건을 가져왔습니다.`); render();
}

    const root=await driveMkdir("AI WIKI", null);
    const id=await driveMkdir(projFolderName(p), root);
    const subs={}; for(const d of SUBDIRS){ jobLabel(`드라이브 폴더 만드는 중 · ${d}`); subs[d]=await driveMkdir(d, id); }
    const cur=S.projects.find(x=>x.id===p.id)||p;
    cur.folders={...(cur.folders||{}), drive:{root, id, subs, at:now()}}; await Store.saveProject(cur);
    toast(`구글 드라이브에 'AI WIKI/${projFolderName(p)}' 폴더와 하위 폴더 ${SUBDIRS.length}개를 만들었습니다.`); return true;

  finally{ jobEnd(); render(); }
}
function projReadme(p){

async function makeObsidianFolder(p){
  try{ await needZip(); }catch(e){ toast(e.message,true); return false; }
  const zip=new JSZip(); const root=zip.folder("AI WIKI").folder(projFolderName(p));
  root.file("README.md", projReadme(p));
  const guide={"자료":"수집한 자료 노트(PDF·HWPX·웹·RISS·KCI)","분석":"분석 보고서와 종합 분석","원고":"AI 집필 원고","참고문헌":"참고문헌 목록"};
  SUBDIRS.forEach(d=>root.folder(d).file(`_${d} 안내.md`, `# ${d}\n\n${guide[d]}을 두는 폴더입니다. ([[README]])\n`));
  const blob=await zip.generateAsync({type:"blob"});
  await saveFile(`AI WIKI - ${projFolderName(p)} (Obsidian 폴더).zip`, blob);
  const cur=S.projects.find(x=>x.id===p.id)||p;
  cur.folders={...(cur.folders||{}), obsidian:{path:`AI WIKI/${projFolderName(p)}`, at:now()}}; await Store.saveProject(cur);

  return true;
}

async function deleteProjectFlow(id){
  const p=S.projects.find(x=>x.id===id); if(!p) return;

  for(const s of S.all.filter(s=>pidOf(s)===id)){ if(s.pdfAsset&&cap.assets) cap.assets.delete(s.pdfAsset).catch(()=>{}); await Store.deleteSource(s.id); }

function countBy(arr, fn){ const m=new Map(); for(const x of arr){ const ks=[].concat(fn(x)).filter(v=>v!==undefined&&v!==null&&v!==""); for(const k of ks) m.set(k,(m.get(k)||0)+1); } return [...m.entries()].sort((a,b)=>b[1]-a[1]); }
function hbars(entries, top=8){

}

function renderQueue(){ const el=$("#queue"); if(!el) return; el.innerHTML=S.queue.slice(0,12).map(q=>`<div><span>${esc(q.name)}${q.note?` <span class="muted small">— ${esc(q.note)}</span>`:""}</span><span>${q.id?`<button class="btn sm ghost" data-act="open" data-v="${q.id}" type="button">${esc(q.st)} · 열기</button>`:esc(q.st)}</span></div>`).join(""); }

function filtered(){
  const f=S.f, q=f.q.trim().toLowerCase();
  let L=S.sources.filter(s=>(!f.topic||s.topic===f.topic)&&(!f.ch||s.ch===f.ch)&&(!f.kind||s.kind===f.kind)&&(f.grade===""||String(n(s.grade))===f.grade));
  if(q) L=L.filter(s=>[s.title,s.author,s.topic,s.summary,(s.keywords||[]).join(" "),s.myView].join(" ").toLowerCase().includes(q));
  const so=f.sort;
  if(so==="grade") L=[...L].sort((a,b)=>n(b.grade)-n(a.grade));
  else if(so==="title") L=[...L].sort((a,b)=>String(a.title).localeCompare(String(b.title),"ko"));
  return L;
}
function vLibrary(){
  const L=filtered(), topics=[...new Set(S.sources.map(s=>s.topic).filter(Boolean))].sort(), f=S.f;
  const opt=(v,l,cur)=>`<option value="${esc(v)}" ${cur===v?"selected":""}>${esc(l)}</option>`;
  const selN=[...S.sel].filter(id=>S.sources.some(s=>s.id===id)).length;
  return head("자료 라이브러리", "자료 라이브러리", `${S.sources.length}건 중 ${L.length}건 표시`, `<button class="btn" data-act="go" data-v="collect" type="button">자료 추가</button>`)
  + `<div class="filters">

      <select id="fgrade">${opt("","모든 등급",f.grade)}${[5,4,3,2,1,0].map(g=>opt(String(g),g?`${g}등급 · ${GL[g]}`:"미분류",f.grade)).join("")}</select>
      <select id="fsort">${opt("new","최근 추가순",f.sort)}${opt("grade","관련도 높은순",f.sort)}${opt("title","제목순",f.sort)}</select>

  + `<section class="panel" style="padding:6px 16px">${L.length?`<div class="row small muted" style="padding:8px 4px;border-bottom:1px solid var(--line)"><label class="check"><input type="checkbox" data-act="selAll" ${L.every(s=>S.sel.has(s.id))?"checked":""}> 전체 선택</label></div><div class="list">${L.map(s=>`
      <div class="item">
        <input type="checkbox" class="check" style="margin-top:5px;accent-color:var(--accent)" data-act="sel" data-v="${s.id}" ${S.sel.has(s.id)?"checked":""} aria-label="선택">
        ${gb(s.grade)}
        <div style="min-width:0"><div class="t" data-act="open" data-v="${s.id}">${esc(s.title)}${exBadge(s)}</div>
          <div class="meta">${CH[s.ch]||s.ch}${s.kind?" · "+esc(s.kind):""}${s.author?" · "+esc(s.author):""}${s.year?" ("+esc(s.year)+")":""}${s.topic?" · <b>"+esc(s.topic)+"</b>":""}${s.analysis?" · 분석 완료":""}${s.myView?" · 내 관점":""}</div>
          ${(s.keywords||[]).length?`<div class="kw">${s.keywords.slice(0,7).map(k=>`<span class="chip">${esc(k)}</span>`).join("")}</div>`:""}
        </div>
        <div class="acts row"><button class="btn sm ghost" data-act="open" data-v="${s.id}" type="button">열기</button></div>
      </div>`).join("")}</div>`:`<div class="empty"><b>조건에 맞는 자료가 없습니다</b>검색어나 필터를 바꾸거나 새 자료를 수집하세요.</div>`}</section>`;

      <p class="small muted">저장한 파일을 브라우저로 열면 이 화면 그대로 쓸 수 있습니다. 자료는 그 브라우저에 저장되며, AI 기능과 원문 PDF 다운로드는 Claude 안에서 열 때만 동작합니다.</p>

    <section class="panel stack" style="margin-top:16px"><div class="panel-head"><h2>Obsidian ↔ 구글 드라이브</h2></div>
      <p class="small muted">Obsidian 볼트를 구글 드라이브에 동기화해 두면, 위키 자료를 드라이브에 노트로 보내고 드라이브의 노트를 위키로 가져와 서로 주고받을 수 있습니다.</p>
      <div class="grid g2">
        <div class="stack"><h3>위키 → 드라이브</h3><p class="small muted">위 '범위'에서 고른 자료 ${expList().length}건을 프런트매터가 붙은 .md 노트와 색인 노트로 드라이브에 저장합니다.</p><button class="btn primary" data-act="driveExport" type="button" ${cap.mcp&&!job?"":"disabled"}>드라이브로 보내기</button></div>
        <div class="stack"><h3>드라이브 → 위키</h3>
          <div class="row" style="flex-wrap:nowrap"><input type="search" id="dsyncQ" value="${esc(S.dsync.q)}" placeholder="파일 이름 검색어 (예: .md, 볼트 폴더명)"><button class="btn" data-act="dsyncFind" type="button" ${cap.mcp&&!S.dsync.busy?"":"disabled"}>찾기</button></div>
          ${S.dsync.items.length?`<p class="small">노트 ${S.dsync.items.length}건: ${esc(S.dsync.items.slice(0,6).map(f=>f.name).join(", "))}${S.dsync.items.length>6?" …":""}</p><button class="btn primary" data-act="dsyncImport" type="button" ${S.dsync.busy?"disabled":""}>${S.dsync.items.length}건 가져오기</button>`:""}
        </div>
      </div>
      ${cap.mcp?"":`<p class="note">구글 드라이브 연동은 Claude 앱이나 claude.ai에서 Google Drive 커넥터를 연결했을 때 동작합니다.</p>`}
    </section>
    <section class="panel" style="margin-top:16px"><div class="panel-head"><h2>데이터 삭제</h2></div>
      <div class="row"><button class="btn danger" data-act="delExamples" type="button">예시 자료 삭제</button><button class="btn danger" data-act="delUncl" type="button">1등급(무관) 자료 삭제</button><button class="btn danger" data-act="delAll" type="button">모든 자료 삭제</button></div>
      <p class="small muted" style="margin-top:8px">삭제 전에 JSON 백업을 받아 두세요. 삭제한 자료는 되돌릴 수 없습니다.</p></section>`;
}

let lastView=null;
function render(){
  renderNav();
  const main=$("#main"); const y=window.scrollY;
  if(S.view!=="home" && !S.pid) S.view="home";
  const v={home:vHome, dash:vDash, collect:vCollect, library:vLibrary, detail:vDetail, analysis:vAnalysis, thesis:vThesis, refs:vRefs, write:vWrite, exchange:vExchange}[S.view]||vDash;
  const VN=Object.fromEntries(NAV); VN.detail="자료";
  main.innerHTML=(S.view!=="home"?`<nav class="crumb" aria-label="현재 위치"><button type="button" data-act="go" data-v="home">AI WIKI</button><span>›</span><button type="button" data-act="go" data-v="dash">${esc(clip(curProj()?.name||"",30))}</button><span>›</span><b>${VN[S.view]||""}</b></nav>`:"")+v();
  if(S.view==="collect") renderQueue();
  if(lastView===S.view) window.scrollTo(0,y); else window.scrollTo(0,0);
  lastView=S.view; pending=false;
}
let pending=false;
function editing(){ const a=document.activeElement; return a && $("#main").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type!=="checkbox"; }
function softRender(force){ if(!force && editing()){ pending=true; return; } render(); }
document.addEventListener("focusout", ()=>{ setTimeout(()=>{ if(pending && !editing()) render(); }, 150); });

/* ---------- 이벤트 ---------- */
let pickCtx=null;
const fileInput=$("#filePick");
fileInput.addEventListener("change", ()=>{ const fs=[...fileInput.files]; fileInput.value=""; fileInput.removeAttribute("webkitdirectory"); if(!fs.length) return; route(fs); });
function route(fs){
  if(S.view==="exchange") importExchange(fs.filter(f=>/\.(md|txt|json|html?)$/i.test(f.name)));
  else ingestFiles(fs);
}
document.addEventListener("dragover", e=>{ const d=e.target.closest?.("#drop"); if(d){ e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e=>{ const d=e.target.closest?.("#drop"); if(d) d.classList.remove("over"); });
document.addEventListener("drop", e=>{ const d=e.target.closest?.("#drop"); if(!d) return; e.preventDefault(); d.classList.remove("over"); const fs=[...e.dataTransfer.files]; if(fs.length) route(fs); });
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.dataset && e.target.dataset.np && e.target.type==="text"){ e.preventDefault(); createProject(); return; } if((e.key==="Enter"||e.key===" ") && e.target.id==="drop"){ e.preventDefault(); e.target.click(); }
  if(e.key==="Enter"){ const m={driveQ:driveFind, acadQ:acadSearch, dsyncQ:dsyncFind}[e.target.id]; if(m){ e.preventDefault(); m(); } } });

const go = v => { if(v!=="home" && !S.pid){ toast("먼저 대문에서 프로젝트를 만들거나 고르세요."); S.view="home"; S.showNew=!S.projects.length; render(); return; } S.view=v; render(); };
document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v;
  const cur = () => S.sources.find(x=>x.id===S.srcId);
  switch(a){
    case "go": if(v==="write" && !S.draftId && S.drafts[0]) S.draftId=S.drafts[0].id; go(v); break;
    case "tab": S.tab=v; render(); break;
    case "pick": fileInput.accept=v; fileInput.click(); break;
    case "pickDir": fileInput.accept=""; fileInput.setAttribute("webkitdirectory",""); fileInput.click(); break;
    case "open": S.srcId=v; go("detail"); break;
    case "kw": S.f={...S.f, q:v}; go("library"); break;
    case "classifyUncl": classifyMany(S.sources.filter(s=>!n(s.grade))); break;
    case "classifyOne": { const s=cur(); if(s) classifyMany([s]); break; }
    case "analyze": analyzeSource(v); render(); break;
    case "copyAn": { const s=cur(); copy(s?.analysis||""); break; }
    case "setGrade": { const s=cur(); if(!s) break; await Store.saveSource({...s, grade:n(v), gradeBy:"user"}); render(); break; }
    case "dlPdf": { const s=cur(); if(!s?.pdfAsset) break; try{ const r=await fetch("/_blob/"+s.pdfAsset); if(!r.ok) throw 0; const b=await r.blob(); await saveFile((s.fileName||s.title+".pdf").replace(/[\\/:*?"<>|]/g," "), b); }catch{ toast("보관된 원문을 찾지 못했습니다.", true); } break; }
    case "delOne": { const s=cur(); if(s && await ask(`'${clip(s.title,40)}' 자료를 삭제할까요? 분석 보고서와 내 관점도 함께 지워집니다.`)){ if(s.pdfAsset && cap.assets) cap.assets.delete(s.pdfAsset).catch(()=>{}); await Store.deleteSource(s.id); toast("삭제했습니다."); go("library"); } break; }
    case "sel": if(el.checked) S.sel.add(v); else S.sel.delete(v); render(); break;
    case "selAll": { const L=filtered(); if(el.checked) L.forEach(s=>S.sel.add(s.id)); else L.forEach(s=>S.sel.delete(s.id)); render(); break; }
    case "selNone": S.sel.clear(); render(); break;
    case "bulkClassify": classifyMany(S.sources.filter(s=>S.sel.has(s.id))); break;
    case "bulkSyn": S.syn.ids=new Set(S.sel); go("analysis"); break;
    case "bulkExport": S.exp.scope="sel"; go("exchange"); break;
    case "bulkDel": { const L=S.sources.filter(s=>S.sel.has(s.id)); if(L.length && await ask(`선택한 ${L.length}건을 삭제할까요?`)){ for(const s of L){ if(s.pdfAsset&&cap.assets) cap.assets.delete(s.pdfAsset).catch(()=>{}); await Store.deleteSource(s.id);} toast(`${L.length}건을 삭제했습니다.`); render(); } break; }
    case "delExamples": { const L=S.sources.filter(s=>s.isExample); if(!L.length){ toast("예시 자료가 없습니다."); break; } if(await ask(`예시 자료 ${L.length}건을 삭제할까요?`)){ for(const s of L) await Store.deleteSource(s.id); for(const d of S.drafts.filter(d=>d.isExample)) await Store.deleteDraft(d.id); toast("예시 자료를 삭제했습니다."); render(); } break; }
    case "delUncl": { const L=S.sources.filter(s=>n(s.grade)===1); if(!L.length){ toast("1등급 자료가 없습니다."); break; } if(await ask(`관련도 1등급(무관) 자료 ${L.length}건을 삭제할까요?`)){ for(const s of L) await Store.deleteSource(s.id); toast("삭제했습니다."); render(); } break; }
    case "delAll": { if(!S.sources.length) break; if(await ask(`모든 자료 ${S.sources.length}건을 삭제할까요? 원고와 논문 정보는 남습니다.`,"모두 삭제")){ for(const s of [...S.sources]){ if(s.pdfAsset&&cap.assets) cap.assets.delete(s.pdfAsset).catch(()=>{}); await Store.deleteSource(s.id);} toast("모든 자료를 삭제했습니다."); render(); } break; }
    case "scrape": {
      const url=$("#webUrl").value.trim(); if(!/^https?:\/\//.test(url)){ toast("http:// 또는 https://로 시작하는 주소를 입력하세요."); break; }
      el.disabled=true; el.textContent="가져오는 중…";
      try{ const r=await scrapeWeb(url); const t=trimText(r.md); if(!t.text) throw {code:"tool_error"};
        const src=newSource({ch:"web", url, title:r.title||url, text:t.text, cut:t.cut, publisher:(()=>{try{return new URL(url).hostname}catch{return ""}})()});
        await Store.saveSource(src); S.queue.unshift({name:src.title, st:"저장됨", id:src.id});
        render(); if($("#optAuto")?.checked!==false && cap.sample) classifyMany([src]);
      }catch(err){ toast(MCP_ERR[err.code]||"웹 페이지를 가져오지 못했습니다. 본문을 직접 붙여 넣으세요.", true); }
      finally{ const b=$('[data-act="scrape"]'); if(b){ b.disabled=false; b.textContent="가져오기"; } }
      break; }
    case "saveWeb": {
      const text=$("#webText").value.trim(); if(!text){ toast("본문을 붙여 넣으세요."); break; }
      const t=trimText(text); const url=$("#webUrl").value.trim();
      const src=newSource({ch:"web", url, title:$("#webTitle").value.trim()||url||"웹 자료", publisher:$("#webPub").value.trim(), text:t.text});
      const auto=$("#optAuto")?.checked; await Store.saveSource(src); S.queue.unshift({name:src.title, st:"저장됨", id:src.id}); render(); if(auto&&cap.sample) classifyMany([src]); break; }
    case "saveManual": {
      const text=$("#mText").value.trim(); if(!text){ toast("내용을 입력하세요."); break; }
      const src=newSource({ch:"manual", title:$("#mTitle").value.trim()||clip(text,30), author:$("#mAuthor").value.trim(), year:$("#mYear").value.trim(), text:trimText(text).text, kind:"메모"});
      const auto=$("#optAuto")?.checked; await Store.saveSource(src); S.queue.unshift({name:src.title, st:"저장됨", id:src.id}); render(); if(auto&&cap.sample) classifyMany([src]); break; }
    case "synType": S.syn.type=v; render(); break;
    case "synSel": if(el.checked) S.syn.ids.add(v); else S.syn.ids.delete(v); render(); break;
    case "synPick": S.syn.ids = n(v) ? new Set(S.sources.filter(s=>n(s.grade)>=n(v)).map(s=>s.id)) : new Set(); render(); break;
    case "synth": synthesize(); render(); break;
    case "synCopy": copy(S.syn.last?.text||""); break;
    case "synSave": { const L=S.syn.last; if(!L) break; const src=newSource({ch:"ai", kind:"보고서", title:`${S.syn.type} · ${stamp()}`, author:"AI WIKI", year:String(new Date().getFullYear()), text:L.text+"\n\n---\n자료 번호표\n"+L.refs, analysis:L.text, myView:S.syn.view, summary:clip(extractSec(L.text,1)||L.text,400), topic:S.thesis.topic?"종합 분석":"", grade:0}); await Store.saveSource(src); toast("위키에 'AI 생성' 자료로 저장했습니다."); S.srcId=src.id; go("detail"); break; }
    case "insight": thesisInsight(); render(); break;
    case "regradeAll": { if(!S.sources.length){ toast("자료가 없습니다."); break; } if(await ask(`자료 ${S.sources.length}건의 등급을 현재 논문 정보로 다시 매길까요? 직접 지정한 등급도 바뀝니다.`,"다시 매기기",false)) classifyMany(S.sources.filter(s=>s.ch!=="ai")); break; }
    case "refCopy": copy(refsText(false)); break;
    case "refSave": saveFile(`참고문헌-${stamp()}.txt`, refsText(true)); break;
    case "newDraft": { const d=newDraft(); await Store.saveDraft(d); S.draftId=d.id; go("write"); break; }
    case "openDraft": S.draftId=v; render(); break;
    case "delDraft": { const d=curDraft(); if(d && await ask(`'${clip(d.title,40)}' 원고를 삭제할까요?`)){ await Store.deleteDraft(d.id); S.draftId=S.drafts[0]?.id||null; render(); } break; }
    case "dset": { const d=curDraft(); if(!d) break; d[el.dataset.k]=v; await Store.saveDraft(d); render(); break; }
    case "toc": recommendToc(); render(); break;
    case "addCh": { const d=curDraft(); d.toc.push({id:uid(), title:`${["Ⅰ","Ⅱ","Ⅲ","Ⅳ","Ⅴ","Ⅵ","Ⅶ","Ⅷ","Ⅸ","Ⅹ"][d.toc.length]||d.toc.length+1}. 새 장`, secs:[{id:uid(), title:"1. 새 절", target:800, brief:"", content:"", prev:""}]}); await Store.saveDraft(d); render(); break; }
    case "addSec": { const d=curDraft(); const c=d.toc.find(x=>x.id===v); c.secs.push({id:uid(), title:`${c.secs.length+1}. 새 절`, target:800, brief:"", content:"", prev:""}); await Store.saveDraft(d); render(); break; }
    case "delCh": { const d=curDraft(); const c=d.toc.find(x=>x.id===v); if(c && await ask(`'${clip(c.title,30)}' 장과 그 안의 본문을 삭제할까요?`)){ d.toc=d.toc.filter(x=>x.id!==v); await Store.saveDraft(d); render(); } break; }
    case "delSec": { const d=curDraft(); const f=findSec(d,v); if(f.s && (!f.s.content || await ask(`'${clip(f.s.title,30)}' 절을 삭제할까요?`))){ f.c.secs.splice(f.i,1); await Store.saveDraft(d); render(); } break; }
    case "writeSec": writeMany([v], "절 집필"); break;
    case "writeCh": { const d=curDraft(); const c=d.toc.find(x=>x.id===v); const ids=c.secs.map(s=>s.id); if(c.secs.some(s=>s.content) && !(await ask("이 장에 이미 쓴 절이 있습니다. 모두 다시 쓸까요? (각 절은 되돌리기로 이전 본문을 복구할 수 있습니다)","다시 쓰기",false))) break; writeMany(ids, "장 집필"); break; }
    case "writeAll": { const d=curDraft(); const ids=d.toc.flatMap(c=>c.secs).filter(s=>!s.content).map(s=>s.id); if(!ids.length){ toast("비어 있는 절이 없습니다."); break; } writeMany(ids, "전체 집필"); break; }
    case "revise": { const box=el.closest(".row"); const instr=($("[data-revtxt]",box).value.trim()||$("[data-revsel]",box).value); reviseSection(v, instr); break; }
    case "undo": { const d=curDraft(); const f=findSec(d,v); if(f.s?.prev!=null){ const t=f.s.content; f.s.content=f.s.prev; f.s.prev=t; await Store.saveDraft(d); render(); toast("이전 본문으로 되돌렸습니다. 다시 누르면 수정본으로 돌아갑니다."); } break; }
    case "togglePreview": S.preview=!S.preview; render(); break;
    case "draftExport": { const d=curDraft(); const m=draftMarkdown(d); const base=d.title.replace(/[\\/:*?"<>|]/g," ").slice(0,60)||"원고";
      if(v==="md") saveFile(base+".md", m); else if(v==="txt") saveFile(base+".txt", m.replace(/^#+\s*/gm,"").replace(/\*\*/g,"")); else saveFile(base+".html", htmlDoc(d.title, md(m))); break; }
    case "expScope": S.exp.scope=v; render(); break;
    case "export": doExport(v); break;
    case "newProj": S.showNew=true; S.view="home"; render(); setTimeout(()=>{ $("#newProj")?.scrollIntoView({behavior:"smooth",block:"start"}); $("#npName")?.focus(); },30); break;
    case "hideNew": S.showNew=false; render(); break;
    case "createProj": createProject(); break;
    case "openProj": setProject(v); S.view="dash"; render(); break;
    case "renameProj": { const p=S.projects.find(x=>x.id===v); if(!p) break; const nm=await promptText("새 프로젝트 이름", p.name); if(nm && nm!==p.name){ if(S.projects.some(x=>x.name===nm)){ toast("같은 이름의 프로젝트가 있습니다."); break; } p.name=nm; await Store.saveProject(p); toast("이름을 바꿨습니다. 이미 만든 폴더 이름은 그대로입니다."); render(); } break; }
    case "delProj": deleteProjectFlow(v); break;
    case "mkObs": { const p=S.projects.find(x=>x.id===v); if(p) makeObsidianFolder(p).then(render); break; }
    case "mkDrive": { const p=S.projects.find(x=>x.id===v); if(p) makeDriveFolders(p); break; }
    case "driveFind": driveFind(); break;
    case "drivePick": if(el.checked) S.drive.picked.add(v); else S.drive.picked.delete(v); render(); break;
    case "drivePickTop": S.drive.picked=new Set(S.drive.items.filter(f=>!f.have).slice(0,20).map(f=>f.id)); render(); break;
    case "drivePickNone": S.drive.picked=new Set(); render(); break;
    case "driveImport": driveImport(); break;
    case "driveExport": driveExport(); break;
    case "dsyncFind": dsyncFind(); break;
    case "dsyncImport": dsyncImport(); break;
    case "acadSite": S.acad.site=v; S.acad.items=[]; S.acad.note=""; render(); break;
    case "acadSearch": acadSearch(); break;
    case "acadFetch": acadFetch(v); break;
    case "acadPaste": acadPaste(); break;
    case "refMode": S.refOpt.mode=v; render(); break;
    case "refCsv": { const L=refList(); const q=x=>`"${String(x??"").replace(/"/g,'""')}"`; saveFile(`서지정보-${stamp()}.csv`, "\ufeff"+["저자,출판연도,제목,출판사·학술지,관련도등급,출처,URL", ...L.map(s=>[s.author,s.year,s.title,s.publisher,n(s.grade),CH[s.ch]||s.ch,s.url].map(q).join(","))].join("\n")); break; }
    case "saveApp": saveFile(`AI_WIKI-${stamp()}.html`, buildStandalone()); break;
  }
});
async function copy(t){ try{ await navigator.clipboard.writeText(t); toast("복사했습니다."); }catch{ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast("복사했습니다.");}catch{toast("복사하지 못했습니다.",true);} ta.remove(); } }

document.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="fq"){ S.f.q=t.value; debounce("fq", ()=>{ const pos=t.selectionStart; render(); const n2=$("#fq"); if(n2){ n2.focus(); n2.setSelectionRange(pos,pos);} }, 250); return; }
  if(t.id==="myView"){ const id=t.dataset.id; $("#mvState").textContent="입력 중…"; debounce("mv"+id, async ()=>{ const s=S.sources.find(x=>x.id===id); if(!s) return; await Store.saveSource({...s, myView:t.value}); const st=$("#mvState"); if(st) st.textContent="저장됨"; }, 900); return; }
  if(t.id==="synView"){ S.syn.view=t.value; return; }
  if(t.id==="driveQ"){ S.drive.q=t.value; return; }
  if(t.dataset.np){ const k=t.dataset.np; S.np[k]= t.type==="checkbox" ? t.checked : t.value; if(k==="name"){ const tr=$(".tree span:nth-child(2)"); if(tr) tr.textContent=`└ ${projFolderName({name:t.value||"프로젝트명"})}/`; } return; }
  if(t.id==="acadQ"){ S.acad.q=t.value; return; }
  if(t.id==="dsyncQ"){ S.dsync.q=t.value; return; }
  const mf=t.closest("#metaForm");
  if(mf){ const id=mf.dataset.id, k=t.dataset.k; debounce("meta"+id+k, async ()=>{ const s=S.sources.find(x=>x.id===id); if(!s) return; const val = k==="keywords" ? t.value.split(/[,，;；]/).map(x=>x.trim()).filter(Boolean) : t.value; await Store.saveSource({...s, [k]:val}); }, 800); return; }
  const tf=t.closest("#thesisForm");
  if(tf && t.dataset.k){ const k=t.dataset.k; S.thesis[k] = k==="keywords" ? t.value.split(/[,，;；]/).map(x=>x.trim()).filter(Boolean) : t.value; $("#thState").textContent="입력 중…"; debounce("thesis", async ()=>{ await Store.saveThesis(); const st=$("#thState"); if(st) st.textContent="저장됨"; }, 900); return; }
  const df=t.closest("#draftForm");
  if(df && t.dataset.k){ const d=curDraft(); if(!d) return; const k=t.dataset.k; d[k] = (k==="target"||k==="minGrade") ? n(t.value) : t.value; if(k==="target") $("#tgtVal").textContent=n(t.value).toLocaleString()+"자"; debounce("draft"+d.id, ()=>Store.saveDraft(d), 700); return; }
  const sec=t.closest(".sec");
  if(sec && t.dataset.f){ const d=curDraft(); const f=findSec(d, sec.dataset.sid); if(!f.s) return; const k=t.dataset.f; f.s[k] = k==="target" ? Math.max(100,n(t.value)) : t.value;
    if(k==="content"){ const c=$(".cnt",sec); const L=len(t.value); c.textContent=`${L.toLocaleString()}/${n(f.s.target).toLocaleString()}자`; t.rows=Math.min(24,Math.max(5,Math.ceil(L/60))); }
    debounce("draft"+d.id, ()=>Store.saveDraft(d), 900); return; }
  const ch=t.closest(".chapter");
  if(ch && t.dataset.cf){ const d=curDraft(); const c=d.toc.find(x=>x.id===ch.dataset.cid); c.title=t.value; debounce("draft"+d.id, ()=>Store.saveDraft(d), 900); return; }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.id==="projSel"){ if(t.value){ setProject(t.value); if(S.view==="home") S.view="dash"; } render(); return; }
  if(t.dataset && t.dataset.np && t.type==="checkbox"){ S.np[t.dataset.np]=t.checked; return; }
  if(t.id==="ftopic"){ S.f.topic=t.value; render(); }
  else if(t.id==="fch"){ S.f.ch=t.value; render(); }
  else if(t.id==="fgrade"){ S.f.grade=t.value; render(); }
  else if(t.id==="fsort"){ S.f.sort=t.value; render(); }
  else if(t.id==="refMin"){ S.refOpt.min=n(t.value); render(); }
  else if(t.id==="refStyle"){ S.refOpt.style=t.value; render(); }
  else if(t.id==="refAttr"){ S.refOpt.attr=t.checked; render(); }
  else if(t.id==="refGroup"){ S.refOpt.group=t.checked; render(); }
  else if(t.id==="expMin"){ S.exp.min=n(t.value); render(); }
  else if(t.closest("#draftForm") && t.dataset.k==="minGrade"){ const d=curDraft(); d.minGrade=n(t.value); Store.saveDraft(d).then(render); }
  else if(t.closest("#draftForm") && t.dataset.k==="target"){ render(); }
});

boot();
})();
</script>
